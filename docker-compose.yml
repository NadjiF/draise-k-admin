services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      # Valeurs lues dans le fichier .env ; « :? » arrête le démarrage si l'une manque.
      POSTGRES_USER: ${POSTGRES_USER:?Variable POSTGRES_USER manquante dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable POSTGRES_PASSWORD manquante dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?Variable POSTGRES_DB manquante dans .env}
    ports:
      # Accessible uniquement depuis la machine locale
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Données conservées entre deux redémarrages
      - db-data:/var/lib/postgresql
      # Exécuté une seule fois, au premier démarrage (volume vide)
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Base réservée aux tests de l'API (npm test), séparée de la base de développement.
  # Lancement : docker compose up -d db-test
  db-test:
    image: postgres:18
    # Le profil « test » évite qu'elle démarre avec un simple « docker compose up ».
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Variable POSTGRES_USER manquante dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable POSTGRES_PASSWORD manquante dans .env}
      # Nom fixe : les tests refusent de tourner sur une base dont le nom ne finit pas par _test.
      POSTGRES_DB: draisek_admin_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    # Données en mémoire : rien à conserver, et plus rapide. La table est créée
    # par les tests eux-mêmes, qui réexécutent api/db/init.sql avant chaque test.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d draisek_admin_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
